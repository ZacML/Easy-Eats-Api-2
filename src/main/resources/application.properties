spring.application.name=api

#Configuração do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/easy_eats
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA / Hibernate
spring.jpa.database-plataform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Permite acesso pela rede local do celular/Expo
server.address=0.0.0.0


# Configuração JWT
jwt.secret=VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JFYXN5RWF0cw==
jwt.expiration=3600000

# Log global
logging.level.root=INFO

# Log para Spring Security
logging.level.org.springframework.security=DEBUG

# Log para Spring Security
logging.level.br.com.senai.aula=DEBUG

# Log em arquivo
logging.file.name=logs/spring-security.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Actuator
#management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.include=*