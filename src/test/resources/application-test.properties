# Profile "test": banco H2 em memória, totalmente isolado do PostgreSQL de desenvolvimento.
# Sobrepõe apenas o necessário; o restante (ex.: jwt.secret) vem do application.properties principal.

spring.datasource.url=jdbc:h2:mem:easyeats_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O schema é gerado pelas entidades e descartado ao final (as migrations atuais só criam/removem uma tabela "teste")
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs dos testes ficam em target/ e não poluem o projeto
logging.file.name=target/test-logs/spring-security.log
logging.level.org.springframework.security=INFO
